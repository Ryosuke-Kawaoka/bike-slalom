<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>スラロームゲーム V31</title>
<style>
:root{
  --bg:#0f1316;--road:#30363b;--yellow:#ffd84d;--good:#6fe18a;
  --bad:#ff6868;--white:#f6f8fa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e10;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--white)
}
#game{
  position:relative;width:100vw;height:100dvh;max-width:520px;margin:auto;overflow:hidden;
  background:linear-gradient(90deg,#172025 0 8%,var(--road) 8% 92%,#172025 92% 100%);
  touch-action:manipulation;user-select:none
}
.road-edge{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.15)}
.road-edge.l{left:8%}.road-edge.r{right:8%}
#centerline{
  position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.10) 0 18px,transparent 18px 42px)
}
#hud{
  position:absolute;z-index:20;left:14px;right:14px;top:max(12px,env(safe-area-inset-top));
  display:flex;justify-content:space-between;gap:10px;pointer-events:none
}
.hudbox{
  padding:8px 11px;border-radius:12px;background:rgba(0,0,0,.42);
  font-weight:800;font-size:14px;backdrop-filter:blur(5px)
}
#status{
  position:absolute;z-index:22;left:50%;top:17%;transform:translate(-50%,-50%);
  min-width:76%;text-align:center;font-weight:1000;font-size:clamp(27px,9vw,48px);
  text-shadow:0 5px 15px #000;pointer-events:none;white-space:pre-line
}
#substatus{
  position:absolute;z-index:22;left:50%;top:23%;transform:translateX(-50%);
  font-size:13px;font-weight:700;opacity:.85;text-align:center;pointer-events:none
}

.cone,.gate-cone,.finish-cone{
  position:absolute;width:34px;height:42px;transform:translate(-50%,-50%);z-index:6
}
.cone:before,.gate-cone:before,.finish-cone:before{
  content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;
  border-bottom:30px solid #ff6a2c;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))
}
.cone:after,.gate-cone:after,.finish-cone:after{
  content:"";position:absolute;left:2px;bottom:1px;width:30px;height:7px;border-radius:3px;
  background:#f4f4f4;box-shadow:inset 0 0 0 3px #ff6a2c
}

#entryGate,#finishGate{
  position:absolute;left:0;width:100%;height:90px;z-index:7;pointer-events:none
}
#entryGate{top:66%}
#entryGate .left,#finishGate .left{left:27%;top:50%}
#entryGate .right,#finishGate .right{left:73%;top:50%}
#finishGate{top:-12%;opacity:0}
.finish-line{
  position:absolute;left:30%;right:30%;top:50%;height:4px;background:rgba(255,255,255,.9)
}

#bike{
  position:absolute;z-index:10;width:68px;height:118px;left:50%;top:94%;overflow:hidden;
  transform:translate(-50%,-50%) rotate(0deg);transform-origin:50% 58%;
  will-change:left,top,transform;filter:drop-shadow(0 7px 7px rgba(0,0,0,.45))
}
#bikeImage{
  position:absolute;width:74px;height:119px;left:-3px;top:0;
  object-fit:fill;pointer-events:none
}
#bikeImage~*{display:none}
.wheel{
  position:absolute;left:50%;transform:translateX(-50%);width:12px;height:27px;
  border-radius:8px;background:#08090a
}
.wheel.f{top:0}.wheel.r{bottom:0}
.body{
  position:absolute;left:50%;top:13px;transform:translateX(-50%);
  width:30px;height:76px;border-radius:15px 15px 11px 11px;
  background:linear-gradient(#e5e9ec,#8d989f);border:3px solid #101315
}
.rider{
  position:absolute;left:50%;top:34px;transform:translateX(-50%);
  width:30px;height:38px;border-radius:15px 15px 10px 10px;
  background:#4d86bd;border:3px solid #101315
}
.helmet{
  position:absolute;left:50%;top:18px;transform:translateX(-50%);
  width:27px;height:27px;border-radius:50%;background:#111;border:2px solid #050607
}
.bar{
  position:absolute;left:50%;top:24px;transform:translateX(-50%);
  width:49px;height:5px;border-radius:5px;background:#0e1113
}
.light{
  position:absolute;left:50%;top:62px;transform:translateX(-50%);
  width:18px;height:8px;border-radius:3px;background:#ef3d3d;border:2px solid #111
}

#tapLabel{
  position:absolute;z-index:18;left:50%;
  bottom:max(24px,calc(env(safe-area-inset-bottom) + 10px));
  transform:translateX(-50%);width:min(82%,360px);height:72px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.25);
  background:rgba(255,216,77,.13);font-size:20px;font-weight:1000;
  letter-spacing:.08em;pointer-events:none;box-shadow:inset 0 0 28px rgba(255,216,77,.12)
}
#tapLabel.flash{animation:flash .18s ease-out}
@keyframes flash{
  0%{transform:translateX(-50%) scale(.95);background:rgba(255,216,77,.58)}
  100%{transform:translateX(-50%) scale(1);background:rgba(255,216,77,.13)}
}
#tapLayer{position:absolute;z-index:25;inset:0}


#countdown{
  position:absolute;
  z-index:35;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  background:rgba(0,0,0,.10);
}
#countdownText{
  font-size:clamp(72px,22vw,130px);
  font-weight:1000;
  color:#fff;
  text-shadow:
    0 5px 0 rgba(0,0,0,.55),
    0 0 24px rgba(255,216,77,.45);
  transform:scale(1);
}
#countdownText.start{
  font-size:clamp(54px,16vw,100px);
  color:var(--yellow);
}
#countdownText.pop{
  animation:countPop .45s ease-out;
}
@keyframes countPop{
  0%{transform:scale(.55);opacity:0}
  35%{transform:scale(1.14);opacity:1}
  100%{transform:scale(1);opacity:1}
}


#celebration{
  position:absolute;
  z-index:34;
  inset:0;
  pointer-events:none;
  display:none;
  overflow:hidden;
}
#celebration.active{
  display:block;
  animation:screenFlash .85s ease-out;
}
@keyframes screenFlash{
  0%{background:rgba(255,255,255,.95)}
  18%{background:rgba(255,216,77,.35)}
  100%{background:rgba(255,216,77,0)}
}
#allPerfectText{
  position:absolute;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%) scale(.5);
  width:94%;
  text-align:center;
  font-size:clamp(44px,14vw,82px);
  font-weight:1000;
  color:#fff;
  text-shadow:
    0 4px 0 #111,
    0 0 12px #ffd84d,
    0 0 28px #ffd84d;
  opacity:0;
}
#celebration.active #allPerfectText{
  animation:perfectBurst 1.3s cubic-bezier(.18,.8,.24,1.2) forwards;
}
@keyframes perfectBurst{
  0%{transform:translate(-50%,-50%) scale(.35) rotate(-6deg);opacity:0}
  35%{transform:translate(-50%,-50%) scale(1.18) rotate(3deg);opacity:1}
  62%{transform:translate(-50%,-50%) scale(.96) rotate(-1deg);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}
}
.confetti{
  position:absolute;
  top:-12%;
  width:10px;
  height:18px;
  border-radius:3px;
  background:var(--yellow);
  opacity:.95;
  animation:confettiFall 1.9s linear forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(-10vh) rotate(0deg);opacity:1}
  100%{transform:translateY(120vh) rotate(720deg);opacity:0}
}
#perfectSub{
  position:absolute;
  left:50%;
  top:53%;
  transform:translateX(-50%);
  font-size:clamp(18px,5vw,28px);
  font-weight:900;
  color:#6fe18a;
  text-shadow:0 3px 8px #000;
  opacity:0;
}
#celebration.active #perfectSub{
  animation:subFade .7s .45s ease-out forwards;
}
@keyframes subFade{
  from{opacity:0;transform:translateX(-50%) translateY(12px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}


#timeoutFx{
  position:absolute;
  z-index:34;
  inset:0;
  pointer-events:none;
  display:none;
  background:rgba(0,0,0,.28);
}
#timeoutFx.active{
  display:block;
  animation:timeoutFade 1.5s ease-out forwards;
}
@keyframes timeoutFade{
  0%{background:rgba(0,0,0,0)}
  30%{background:rgba(0,0,0,.42)}
  100%{background:rgba(0,0,0,.28)}
}
#timeoutTitle{
  position:absolute;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%) scale(.8);
  width:92%;
  text-align:center;
  font-size:clamp(42px,13vw,78px);
  font-weight:1000;
  color:#d7dce0;
  text-shadow:0 4px 12px #000;
  opacity:0;
}
#timeoutFx.active #timeoutTitle{
  animation:timeoutTitleIn .9s ease-out forwards;
}
@keyframes timeoutTitleIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(1.18)}
  55%{opacity:1;transform:translate(-50%,-50%) scale(.96)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
#timeoutSub{
  position:absolute;
  left:50%;
  top:53%;
  transform:translateX(-50%);
  width:90%;
  text-align:center;
  color:#ffcf7d;
  font-size:clamp(18px,5vw,28px);
  font-weight:900;
  opacity:0;
}
#timeoutFx.active #timeoutSub{
  animation:timeoutSubIn .8s .45s ease-out forwards;
}
@keyframes timeoutSubIn{
  from{opacity:0;transform:translateX(-50%) translateY(12px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}

#overlay{
  position:absolute;z-index:40;inset:0;background:rgba(5,8,10,.86);
  display:flex;align-items:center;justify-content:center;padding:22px;text-align:center
}
#overlay.start-screen{
  background:
    linear-gradient(rgba(5,8,10,.20),rgba(5,8,10,.54)),
    url('title-bg.jpg') center center/cover no-repeat;
}
#overlay.start-screen .panel{
  background:rgba(17,22,26,.88);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}
.panel{
  width:min(94%,430px);padding:24px 20px;border-radius:24px;background:#171c20;
  border:1px solid rgba(255,255,255,.10);box-shadow:0 18px 55px rgba(0,0,0,.5)
}
.panel h1{margin:0 0 10px;font-size:27px}
.panel p{margin:8px 0;line-height:1.65;color:#d9e0e5;font-size:14px}
.modeSelect{display:flex;gap:8px;margin-top:18px}
.modeBtn{
  flex:1;border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px 8px;
  background:#2b3136;color:#fff;font-size:17px;font-weight:900;cursor:pointer
}
.modeBtn.active{background:var(--yellow);color:#111}
#startBtn,#retryBtn{
  margin-top:16px;width:100%;padding:15px;border:0;border-radius:999px;
  background:var(--yellow);color:#101214;font-size:18px;font-weight:1000;cursor:pointer
}
#helpBtn,#backBtn{
  margin-top:10px;width:100%;padding:12px;border:1px solid rgba(255,255,255,.25);
  border-radius:999px;background:rgba(20,25,29,.78);color:#fff;
  font-size:15px;font-weight:900;cursor:pointer
}
.howtoPanel{padding:22px 18px;text-align:left;max-height:calc(100% - 8px);overflow:auto}
.howtoPanel h1{text-align:center}
.howtoLead{text-align:center;color:#fff!important;font-weight:800}
.howtoList{display:grid;gap:9px;margin:16px 0}
.howtoItem{
  display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;
  padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.07)
}
.howtoNum{
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--yellow);color:#111;font-weight:1000
}
.howtoText{font-size:14px;line-height:1.5;color:#e9eef1}
.howtoTimingWrap{min-width:0}
.howtoTimingImage{
  display:block;
  width:100%;
  max-width:340px;
  height:auto;
  margin:10px auto 2px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 6px 18px rgba(0,0,0,.30);
}
.judgeGuide{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;text-align:center}
.judgeGuide div{padding:9px 4px;border-radius:12px;background:rgba(255,255,255,.07);font-size:11px}
.judgeGuide b{display:block;margin-bottom:4px;font-size:13px}
.perfectText{color:#6fe18a}.goodText{color:#ffd84d}.missText{color:#ff6868}
.note{font-size:12px!important;opacity:.72}
</style>
</head>

        <button class="modeBtn" data-mode="5">5秒</button>

<script>
(()=>{
const game=document.getElementById('game');
const bike=document.getElementById('bike');
const overlay=document.getElementById('overlay');
const tapLayer=document.getElementById('tapLayer');
const tapLabel=document.getElementById('tapLabel');
const countEl=document.getElementById('count');
const timerEl=document.getElementById('timer');
const statusEl=document.getElementById('status');
const substatusEl=document.getElementById('substatus');
const countdown=document.getElementById('countdown');
const countdownText=document.getElementById('countdownText');
const celebration=document.getElementById('celebration');
const timeoutFx=document.getElementById('timeoutFx');
const entryGate=document.getElementById('entryGate');
const finishGate=document.getElementById('finishGate');
const musicAudio=document.getElementById('musicAudio');
const engineAudio=document.getElementById('engineAudio');
const accelAudio=document.getElementById('accelAudio');

function stopEngineSounds(){
  [engineAudio,accelAudio].forEach(a=>{
    if(a){a.pause();a.currentTime=0;}
  });
}

function startMenuMusic(){
  if(!musicAudio) return;
  musicAudio.volume=0.5;
  musicAudio.play().catch(()=>{});
}

const TOTAL=5;
const BIKE_Y=.68;
const CONE_Y_OFFSET=.07;
const CONE_SPACING=.245;
const ENTRY_MS=1500;
// アクセルONの正解タイミング（少し早め）
const IDEAL=.37;
let selectedMode=8;
let segmentMs=1040;
let goodHalf=.09;
let perfectHalf=.034;
let exitMs=1150;
let goodPenaltyMs=450;

let cones=[];
let running=false;
let entryRunning=false;
let finishing=false;
let finished=false;
let current=0;
let perfectCount=0;
let successCount=0;
let tapped=false;
let attemptSuccess=false;
let startTime=0;
let segmentStart=0;
let lastFrame=0;
let entryStart=0;
let finishStart=0;
let finishGateY=0;
let finishBikeStartTop=68;
let finishBikeStartLeft=50;
let finishBikeStartAngle=0;
let raf=0;

function size(){return {w:game.clientWidth,h:game.clientHeight}}

function configureMode(mode){
  selectedMode=mode;
  if(mode===8){
    segmentMs=1260; goodHalf=.120; perfectHalf=.046; exitMs=1320; goodPenaltyMs=450;
  }else if(mode===7){
    segmentMs=1080; goodHalf=.105; perfectHalf=.040; exitMs=1180; goodPenaltyMs=450;
  }else if(mode===6){
    segmentMs=900; goodHalf=.090; perfectHalf=.034; exitMs=980; goodPenaltyMs=450;
  }else{
    segmentMs=740; goodHalf=.075; perfectHalf=.028; exitMs=820; goodPenaltyMs=400;
  }

  document.querySelectorAll('.modeBtn').forEach(btn=>{
    btn.classList.toggle('active', Number(btn.dataset.mode)===mode);
  });

  const note=document.getElementById('modeNote');
  if(note){
    note.textContent=
      mode===8 ? '8秒：普通二輪　合格基準 / 判定かなり広め' :
      mode===7 ? '7秒：大型二輪　合格基準 / 判定広め' :
      mode===6 ? '6秒：ベテラン・ライダーレベル / 判定普通' :
                 '5秒：ベテラン・インストラクターレベル / 判定シビア';
  }
}


function enableMenuMusicOnFirstInteraction(){
  const startAudio = ()=>{
    startMenuMusic();
    overlay.removeEventListener('pointerdown', startAudio);
    overlay.removeEventListener('click', startAudio);
  };
  overlay.addEventListener('pointerdown', startAudio, {once:true});
  overlay.addEventListener('click', startAudio, {once:true});
}

function bindModeButtons(){
  document.querySelectorAll('.modeBtn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      startMenuMusic();
      configureMode(Number(btn.dataset.mode));
    });
  });
}

function buildCones(){
  cones.forEach(c=>c.el.remove());
  cones=[];
  const {h}=size();

  for(let i=0;i<TOTAL;i++){
    const el=document.createElement('div');
    el.className='cone';
    game.insertBefore(el,bike);
    cones.push({el,y:h*.30-i*h*CONE_SPACING});
  }
}

function renderCones(){
  const {w,h}=size();
  cones.forEach(c=>{
    c.el.style.left=`${w*.5}px`;
    c.el.style.top=`${c.y + h*CONE_Y_OFFSET}px`;
  });
}

function reset(){
  cancelAnimationFrame(raf);
  running=false;entryRunning=false;finishing=false;finished=false;
  current=0;successCount=0;tapped=false;attemptSuccess=false;
  countEl.textContent=`PERFECT 0 / ${TOTAL}`;
  timerEl.textContent='0.00 s';
  statusEl.textContent='';substatusEl.textContent='';
  if(!countdownRunning){
    countdown.style.display='none';
    countdownText.textContent='';
  }
  bike.style.opacity='1';
  bike.style.left='50%';bike.style.top='94%';
  bike.style.transform='translate(-50%,-50%) rotate(0deg)';
  entryGate.style.top='66%';entryGate.style.opacity='1';
  finishGate.style.opacity='0';finishGate.style.top='-12%';
  buildCones();renderCones();
}

function pathForPhase(p,side){
  const startX=side>0?.74:.26;
  const endX=side>0?.26:.74;
  const smooth=p*p*(3-2*p);
  const x=startX+(endX-startX)*smooth;

  let angle;
  if(p<.16){
    angle=0;
  }else if(p<.30){
    const t=(p-.16)/.14;
    const e=t*t*(3-2*t);
    angle=e*(side>0?-38:38);
  }else if(p<.70){
    angle=side>0?-38:38;
  }else{
    const t=(p-.70)/.30;
    const e=t*t*(3-2*t);
    angle=(1-e)*(side>0?-38:38);
  }
  return {x,angle};
}

function attemptDuration(){
  return segmentMs+(tapped&&!attemptSuccess?goodPenaltyMs:0);
}

function phase(now){
  return Math.max(0,Math.min(1,(now-segmentStart)/attemptDuration()));
}


let countdownRunning=false;

function animateCountdownText(text,isStart=false){
  countdownText.className=isStart?'start':'';
  countdownText.textContent=text;
  void countdownText.offsetWidth;
  countdownText.classList.add('pop');
}

function begin(){
  if(countdownRunning)return;

  countdownRunning=true;
  reset();

  startMenuMusic();
  overlay.classList.remove('start-screen');
  overlay.style.display='none';

  // カウントダウン中からアイドリング音は鳴らしておく
  if(engineAudio){
    engineAudio.volume=0.28;
    engineAudio.currentTime=0;
    engineAudio.play().catch(()=>{});
  }

  countdown.style.display='flex';

  const steps=[
    {text:'3',ms:700},
    {text:'2',ms:700},
    {text:'1',ms:700},
    {text:'START!',ms:550,start:true}
  ];

  let index=0;

  const next=()=>{
    const step=steps[index];
    animateCountdownText(step.text,!!step.start);

    setTimeout(()=>{
      index++;

      if(index<steps.length){
        next();
      }else{
        countdown.style.display='none';
        countdownText.textContent='';
        countdownRunning=false;
        beginGame();
      }
    },step.ms);
  };

  next();
}

function beginGame(){
  overlay.classList.remove('start-screen');
  overlay.style.display='none';

  entryRunning=true;
  entryStart=performance.now();
  lastFrame=entryStart;
  raf=requestAnimationFrame(entryLoop);
}

function entryLoop(now){
  if(!entryRunning)return;

  const {h}=size();
  const t=Math.min(1,(now-entryStart)/ENTRY_MS);
  const s=t*t*(3-2*t);
  const blend=.5-.5*Math.cos(Math.PI*t);
  const main0=pathForPhase(0,1);

  bike.style.top=`${94+(68-94)*t}%`;
  bike.style.left=`${(0.50+(main0.x-.50)*blend)*100}%`;
  bike.style.transform='translate(-50%,-50%) rotate(0deg)';
  entryGate.style.top=`${66+28*s}%`;

  const mainStartY=h*BIKE_Y-h*.105;
  cones.forEach((c,i)=>{
    const startY=h*.24-i*h*CONE_SPACING;
    const targetY=mainStartY-i*h*CONE_SPACING;
    c.y=startY+(targetY-startY)*s;
  });
  renderCones();

  if(t>=1){
    entryRunning=false;
    running=true;
    startTime=now;
    segmentStart=now;
    lastFrame=now;
    entryGate.style.opacity='0';
    raf=requestAnimationFrame(loop);
    return;
  }

  raf=requestAnimationFrame(entryLoop);
}

function loop(now){
  if(!running)return;

  const {h}=size();
  const dt=Math.min(.04,(now-lastFrame)/1000);
  lastFrame=now;

  if(finishing){
    const elapsed=now-finishStart;

    // それまでと同じスクロール速度でゴールゲートを近づける
    const gateScroll=(h*CONE_SPACING)/(segmentMs/1000)*dt;
    finishGateY += gateScroll;
    finishGate.style.top=`${finishGateY}px`;

    // バイクも止めずに、そのまま前方へ走り抜ける
    const p=Math.min(1, elapsed/exitMs);
    const e=p*p*(3-2*p);

    const top=finishBikeStartTop + (-18-finishBikeStartTop)*e;
    const left=finishBikeStartLeft + (50-finishBikeStartLeft)*(e*.35);
    const angle=finishBikeStartAngle*(1-e);

    bike.style.top=`${top}%`;
    bike.style.left=`${left}%`;
    bike.style.transform=`translate(-50%,-50%) rotate(${angle}deg) scale(${1+e*.05})`;

    timerEl.textContent=`${((now-startTime)/1000).toFixed(2)} s`;

    // ゴールラインがバイク位置を通過するまで止めない
    const gateLineY=finishGateY + 45; // finish-line の top:50% (90px高の半分)
    const bikeY=h*(top/100);

    if(gateLineY >= bikeY || p>=1){
      finish(now);
      return;
    }

    raf=requestAnimationFrame(loop);
    return;
  }

  const p=phase(now);
  const side=current%2===0?1:-1;
  const pos=pathForPhase(p,side);

  bike.style.left=`${pos.x*100}%`;

  // 前後位置は固定。アクセルONでも前へグイッと動かさない。
  bike.style.top=`${BIKE_Y*100}%`;
  bike.style.transform=`translate(-50%,-50%) rotate(${pos.angle}deg)`;

  const scroll=(h*CONE_SPACING)/(attemptDuration()/1000)*dt;
  cones.forEach(c=>{c.y+=scroll});
  renderCones();

  timerEl.textContent=`${((now-startTime)/1000).toFixed(2)} s`;

  if(!tapped && p>IDEAL+goodHalf){
    fail('LATE','加速が遅い\n横に進みすぎ');
    return;
  }

  if(p>=1 && tapped){
    if(attemptSuccess)successCount++;
    current++;
    countEl.textContent=`PERFECT ${successCount} / ${TOTAL}`;

    if(current>=TOTAL){
      startFinish(now);
      // ゴール処理へ切り替えたあともアニメーションを継続する
      raf=requestAnimationFrame(loop);
      return;
    }

    tapped=false;
    attemptSuccess=false;
    statusEl.textContent='';
    substatusEl.textContent='';
    segmentStart=now;
  }

  raf=requestAnimationFrame(loop);
}

function flash(){
  tapLabel.classList.remove('flash');
  void tapLabel.offsetWidth;
  tapLabel.classList.add('flash');
}

function doTap(){
  if(entryRunning||finishing||!running||finished||tapped)return;

  flash();

  // アクセル操作と同時に効果音を鳴らす。
  if(accelAudio){
    accelAudio.pause();
    accelAudio.currentTime=0;
    accelAudio.volume=1.5;
    accelAudio.play().catch(()=>{});
  }

  const now=performance.now();
  const p=phase(now);
  const d=p-IDEAL;

  if(d<-goodHalf){
    fail('EARLY','加速が早い\n前に進みすぎ');
    return;
  }

  if(d>goodHalf){
    fail('LATE','加速が遅い\n横に進みすぎ');
    return;
  }

  tapped=true;

  const perfect=Math.abs(d)<=perfectHalf;
  if(perfect) perfectCount++;
  // PERFECTだけを成功として数え、GOODは失速させる
  attemptSuccess=perfect;

  statusEl.style.color=perfect?'#6fe18a':'#ffd84d';
  statusEl.textContent=perfect?'PERFECT!':'GOOD!';
  substatusEl.textContent=`${selectedMode}秒モード`;

  if(navigator.vibrate)navigator.vibrate(perfect?28:16);

  setTimeout(()=>{
    if(running&&!finishing){
      statusEl.textContent='';
      substatusEl.textContent='';
    }
  },260);
}

function startFinish(now){
  finishing=true;
  tapped=true;

  // 最後のスラローム位置をそのまま引き継ぐ
  finishBikeStartTop=parseFloat(bike.style.top) || 72;
  finishBikeStartLeft=parseFloat(bike.style.left) || 50;

  const m=(bike.style.transform || '').match(/rotate\(([-0-9.]+)deg\)/);
  finishBikeStartAngle=m ? parseFloat(m[1]) : 0;

  // 中央コーンはここで終了
  cones.forEach(c=>c.el.style.opacity='0');

  const {h}=size();

  // ゴールゲートは次のコーンが来るような位置から自然に流す
  finishGateY=-h*.02;
  finishGate.style.opacity='1';
  finishGate.style.top=`${finishGateY}px`;
  finishStart=now;
}



function launchTimeOverEffect(){
  timeoutFx.classList.remove('active');
  void timeoutFx.offsetWidth;
  timeoutFx.classList.add('active');

  bike.animate([
    {transform:bike.style.transform,opacity:1},
    {transform:'translate(-50%,-44%) rotate(0deg) scale(.98)',opacity:.90},
    {transform:'translate(-50%,-40%) rotate(0deg) scale(.96)',opacity:.72}
  ],{
    duration:1100,
    easing:'ease-out',
    fill:'forwards'
  });

  if(navigator.vibrate){
    navigator.vibrate([80,70,120]);
  }
}

function launchAllPerfectCelebration(){
  celebration.innerHTML=`
    <div id="allPerfectText">ALL PERFECT!!</div>
    <div id="perfectSub">${TOTAL} / ${TOTAL} PERFECT</div>
  `;

  const colors=['#ffd84d','#6fe18a','#ffffff','#ff6868','#5eb8ff'];

  for(let i=0;i<42;i++){
    const p=document.createElement('div');
    p.className='confetti';
    p.style.left=`${Math.random()*100}%`;
    p.style.background=colors[i%colors.length];
    p.style.animationDelay=`${Math.random()*.35}s`;
    p.style.animationDuration=`${1.3+Math.random()*1.1}s`;
    p.style.width=`${7+Math.random()*7}px`;
    p.style.height=`${10+Math.random()*16}px`;
    celebration.appendChild(p);
  }

  celebration.classList.remove('active');
  void celebration.offsetWidth;
  celebration.classList.add('active');

  bike.animate([
    {transform:bike.style.transform,filter:'drop-shadow(0 7px 7px rgba(0,0,0,.45))'},
    {transform:'translate(-50%,-50%) rotate(0deg) scale(1.22)',filter:'drop-shadow(0 0 24px rgba(255,216,77,.95))'},
    {transform:'translate(-50%,-50%) rotate(0deg) scale(1.06)',filter:'drop-shadow(0 0 14px rgba(111,225,138,.8))'}
  ],{
    duration:1000,
    easing:'cubic-bezier(.16,.8,.24,1)',
    fill:'forwards'
  });

  if(navigator.vibrate){
    navigator.vibrate([60,40,80,40,120]);
  }
}

function finish(now){
  stopEngineSounds();
  running=false;finishing=false;finished=true;

  const isAllPerfect = perfectCount===TOTAL;
  if(isAllPerfect){
    launchAllPerfectCelebration();
  }
  cancelAnimationFrame(raf);

  const total=((now-startTime)/1000).toFixed(2);
  const cleared=successCount>=3;

  if(!cleared && !isAllPerfect){
    launchTimeOverEffect();
  }

  statusEl.style.color=cleared?'#6fe18a':'#d7dce0';
  statusEl.textContent=cleared?'GOAL!':'TIME OVER...';
  substatusEl.textContent=cleared?'FINISH':'惜しい！';

  if(navigator.vibrate)navigator.vibrate([30,35,30,35,60]);

  setTimeout(()=>{
    celebration.classList.remove('active');
    timeoutFx.classList.remove('active');
    celebration.innerHTML='<div id="allPerfectText">ALL PERFECT!!</div><div id="perfectSub">5 / 5 PERFECT</div>';
    overlay.innerHTML=`
      <div class="panel">
        <h1>${cleared?'GOAL!':'TIME OVER...'}</h1>
        <p><b>${total} 秒</b></p>
        <p>${selectedMode}秒モード</p>
        <p>PERFECT ${successCount} / ${TOTAL}</p>
        <p class="note">${cleared?'目標クリア！':'惜しい！あと少し！'}</p>
        <button id="retryBtn">もう一度</button>
      </div>`;
    overlay.style.display='flex';

    document.getElementById('retryBtn').onclick=showStartScreen;
  },isAllPerfect?1700:(cleared?240:1400));
}

function fail(title,reason){
  stopEngineSounds();
  running=false;finished=true;cancelAnimationFrame(raf);

  statusEl.style.color='#ff6868';
  statusEl.textContent=title;
  substatusEl.textContent=reason;

  if(navigator.vibrate)navigator.vibrate([70,45,110]);

  setTimeout(()=>{
    overlay.innerHTML=`
      <div class="panel">
        <h1>${title}</h1>
        <p><b>${reason.replace('\n','<br>')}</b></p>
        <p>PERFECT ${successCount} / ${TOTAL}</p>
        <button id="retryBtn">RETRY</button>
      </div>`;
    overlay.style.display='flex';

    document.getElementById('retryBtn').onclick=showStartScreen;
  },450);
}

function showHowTo(){
  overlay.classList.add('start-screen');
  overlay.innerHTML=`
    <div class="panel howtoPanel">
      <h1>遊び方</h1>
      <p class="howtoLead">スラロームのアクセルONのタイミングを練習するゲームです。バイクが向きを変えた時、タイミングよくアクセルを使いましょう。</p>

      <div class="howtoList">
        <div class="howtoItem">
          <span class="howtoNum">1</span>
          <span class="howtoText">目標タイムを選んでスタート</span>
        </div>
        <div class="howtoItem">
          <span class="howtoNum">2</span>
          <div class="howtoTimingWrap">
            <div class="howtoText">タイミングよく「アクセル！」ボタンをタップ</div>
            <img
              class="howtoTimingImage"
              src="timing-example.png"
              alt="PERFECTになるアクセルONのタイミング"
            >
          </div>
        </div>
        <div class="howtoItem">
          <span class="howtoNum">3</span>
          <span class="howtoText">5回中3回以上のPERFECTでクリア</span>
        </div>
      </div>

      <div class="judgeGuide">
        <div><b class="perfectText">PERFECT</b>成功</div>
        <div><b class="goodText">GOOD</b>失速して続行</div>
        <div><b class="missText">EARLY / LATE</b>即終了</div>
      </div>

      <button id="backBtn">もどる</button>
    </div>`;

  document.getElementById('backBtn').onclick=showStartScreen;
}

function showStartScreen(){
  timeoutFx.classList.remove('active');
  overlay.classList.add('start-screen');
  overlay.innerHTML=`
    <div class="panel">
      <h1>スラローム・タイミング</h1>
      <p>目標タイムを選んでスタート。</p>
      <div class="modeSelect">
        <button class="modeBtn ${selectedMode===8?'active':''}" data-mode="8">8秒</button>
        <button class="modeBtn ${selectedMode===7?'active':''}" data-mode="7">7秒</button>
        <button class="modeBtn ${selectedMode===6?'active':''}" data-mode="6">6秒</button>
        <button class="modeBtn ${selectedMode===5?'active':''}" data-mode="5">5秒</button>
      </div>
      <p id="modeNote" class="note"></p>
      <button id="startBtn">START</button>
      <button id="helpBtn">遊び方</button>
    </div>`;

  overlay.style.display='flex';
  reset();
  bindModeButtons();
  configureMode(selectedMode);
  enableMenuMusicOnFirstInteraction();

  document.getElementById('startBtn').onclick=begin;
  document.getElementById('helpBtn').onclick=showHowTo;
}

tapLayer.addEventListener('pointerdown',e=>{
  e.preventDefault();
  doTap();
});

bindModeButtons();
configureMode(8);
enableMenuMusicOnFirstInteraction();
document.getElementById('startBtn').onclick=begin;
document.getElementById('helpBtn').onclick=showHowTo;
reset();
})();
</script>
